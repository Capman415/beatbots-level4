<script>/* v13.1 no pinch / double-tap zoom, long-press menus or page scroll on touch boards & tablets */for(const e of ['gesturestart','gesturechange','dblclick','contextmenu'])addEventListener(e,ev=>ev.preventDefault(),{passive:false});addEventListener('touchmove',e=>e.preventDefault(),{passive:false});addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F'){const d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().catch(()=>{})}});</script>

 d.textContent+=(e.message||'load error')+' '+(e.filename||(e.target&&e.target.src)||'')+(e.lineno?':'+e.lineno:'')+' | '+navigator.userAgent+'\n'},true);

for(var i=0;i<F.length;i++){var sc=document.createElement('script');sc.src=dir+F[i]+'?v='+V;sc.async=false;document.head.appendChild(sc)}})();</script>
<script>/* v12.6: full-screen button only on the title screen, so it never sits on a room's panel border */setInterval(()=>{const b=document.getElementById('fs');if(b&&window.BB)b.style.display=(BB.scene&&BB.scene.constructor&&BB.scene.constructor.name==='TitleScene'&&!document.fullscreenElement)?'':'none'},250)</script>
