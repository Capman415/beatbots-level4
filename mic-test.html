<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beat Bots Mic Test</title>
<style>body{font-family:sans-serif;background:#12302c;color:#fff;margin:0;padding:24px;font-size:22px}
button{font-size:30px;padding:18px 40px;border-radius:18px;border:0;background:#3fb45a;color:#fff;margin:8px;cursor:pointer}
button.alt{background:#2c6b66}#bar{height:50px;background:#233;border-radius:10px;overflow:hidden;margin:14px 0}
#fill{height:100%;width:0;background:linear-gradient(90deg,#6ee678,#ffe066,#ff7b5c)}
#claps{font-size:80px;color:#ffe066}td{padding:4px 14px}td:first-child{color:#9fd}.err{color:#ff9c8a}</style></head><body>
<h1>Beat Bots Mic Test <small style="font-size:16px;opacity:.6">v6</small></h1>
<label><input type="checkbox" id="raw" checked style="width:24px;height:24px"> Raw mode (echo/noise/auto-gain OFF). Uncheck for browser default.</label><br>
<button id="go">START MIC</button><button id="stop" class="alt">STOP</button>
<div id="bar"><div id="fill"></div></div>
<div>Claps heard: <span id="claps">0</span></div>
<table id="info"></table><div id="err" class="err"></div>
<script src="js/mic.js?v=5"></script><script>
let claps=0,peak=0,floor=.003,prev=0,lastOn=0,raf;const $=id=>document.getElementById(id);
function row(k,v){return `<tr><td>${k}</td><td>${v}</td></tr>`}
async function start(){cancelAnimationFrame(raf);$('err').textContent='';try{await MicCore.start($('raw').checked);claps=0;peak=0;loop()}catch(e){$('err').textContent='ERROR: '+e.name+' - '+e.message}}
function stop(){cancelAnimationFrame(raf);MicCore.stop()}
function loop(){const {rms,max:mx}=MicCore.read();peak=Math.max(peak*.995,rms);
 const thr=Math.max(floor*2.5+.004,.008),now=performance.now();
 if(rms>thr&&rms>prev*1.35&&now-lastOn>120){claps++;lastOn=now}else if(rms<thr)floor+=(Math.min(rms,.05)-floor)*.02;prev=Math.max(rms,prev*.6);
 $('fill').style.width=Math.min(100,Math.sqrt(rms)*250)+'%';$('claps').textContent=claps;
 const t=MicCore.track(),set=t.getSettings?t.getSettings():{},ac=MicCore.ctx;
 $('info').innerHTML=row('Device',t.label||'(no label)')+row('Track',`readyState=${t.readyState} enabled=${t.enabled} muted=${t.muted}`)+
  row('Audio engine',`${ac.state}, ${ac.sampleRate} Hz`)+row('Mic settings',JSON.stringify(set))+row('Raw RMS',rms.toFixed(5))+row('Max sample',mx.toFixed(5))+
  row('Peak (decaying)',peak.toFixed(5))+row('Clap threshold',thr.toFixed(5))+row('Verdict',mx===0?'<b class="err">ALL ZEROS - mic sends silence</b>':'Receiving sound ✔');
 raf=requestAnimationFrame(loop)}
$('go').onclick=start;$('stop').onclick=stop;
</script></body></html>
