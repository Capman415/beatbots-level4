<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steady Bots Level 4 has moved</title>
<meta http-equiv="refresh" content="0;url=https://capman415.github.io/steadybots-level4/">
<link rel="canonical" href="https://capman415.github.io/steadybots-level4/">
<script>
/* Redirect /beatbots-level4/... to /steadybots-level4/..., keeping path, query, and hash.
   Also drop any leftover service worker and caches from the old app. */
(function(){
  var dest='https://capman415.github.io/steadybots-level4';
  var rest=location.pathname.replace(/^\/beatbots-level4/,'');
  if(!rest||rest.charAt(0)!=='/') rest='/'+(rest||'');
  var url=dest+rest+location.search+location.hash;
  function go(){location.replace(url)}
  var pending=0;
  function done(){if(--pending<=0)go()}
  try{
    if(window.caches&&caches.keys){pending++;caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}).then(done,done)}
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){pending++;navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}).then(done,done)}
  }catch(e){}
  if(pending===0)go();
  setTimeout(go,800);
})();
</script>
</head>
<body style="font:18px/1.5 system-ui,sans-serif;background:#0d1d1b;color:#e8e2cd;padding:48px 24px">
<p>Steady Bots Level 4 has moved to
<a href="https://capman415.github.io/steadybots-level4/" style="color:#7ad9c8">https://capman415.github.io/steadybots-level4/</a>.</p>
<p>You should be redirected automatically. If not, use the link above.</p>
</body>
</html>
